apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: javierhn-vit-8cards
  namespace: javierhn-restricted
spec:
  slotsPerWorker: 8
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          nodeSelector:
            brightcomputing.com/node-category: 'compute'
          serviceAccountName: javierhn
          volumes:
            - name: mydir
              hostPath:
                path: /home/javierhn/models/voyager/vit_pt/1.21.4
                type: Directory
            - name: scratch
              emptyDir: {}
            - name: dataset
              hostPath:
                path: /voyager/ceph/users/javierhn/datasets/imagenet/ILSVRC2012
                type: Directory
            - name: pretrained
              hostPath:
                path: /voyager/ceph/users/javierhn/datasets/vit_pretrained
                type: Directory
            - name: output
              hostPath:
                path: /voyager/ceph/users/javierhn/results/vit
                type: Directory
          hostIPC: true
          containers:
            - image: vault.habana.ai/gaudi-docker/1.21.4/ubuntu22.04/habanalabs/pytorch-installer-2.6.0:latest
              name: vit-launcher
              resources:
                requests:
                  cpu: 2
                  memory: 4Gi
                limits:
                  cpu: 4
                  memory: 8Gi
              volumeMounts:
                - name: mydir
                  mountPath: /mydir
                - name: scratch
                  mountPath: /scratch
                - name: dataset
                  mountPath: /dataset
                - name: pretrained
                  mountPath: /pretrained
                - name: output
                  mountPath: /output
              command: ["/bin/bash", "-c"]
              args:
                - >-
                  /usr/bin/ssh-keygen -A;
                  /usr/sbin/sshd;
                  declare -xr NUM_NODES=1;

                  declare -xr RUN_PATH=/mydir;
                  declare -xr SYNAPSE_AI_VER=1.21.0;
                  declare -xr MODEL_ROOT=/scratch/Model-References;
                  declare -xr MODEL_PATH=$MODEL_ROOT/PyTorch/computer_vision/classification/ViT;
                  sleep 20s;

                  mpirun  --npernode 1 \
                    --tag-output \
                    --allow-run-as-root \
                    --prefix $MPI_ROOT \
                    -x MODEL_PATH \
                    -x SYNAPSE_AI_VER \
                    $RUN_PATH/setup.sh;

                  $RUN_PATH/run_vit.sh;
                  sleep 500s;


    Worker:
      replicas: 1
      template:
        spec:
          serviceAccountName: javierhn
          volumes:
            - name: mydir
              hostPath:
                path: /home/javierhn/models/voyager/vit_pt/1.21.4
                type: Directory
            - name: scratch
              emptyDir: {}
            - name: dataset
              hostPath:
                path: /voyager/ceph/users/javierhn/datasets/imagenet/ILSVRC2012
                type: Directory
            - name: pretrained
              hostPath:
                path: /voyager/ceph/users/javierhn/datasets/vit_pretrained
                type: Directory
            - name: output
              hostPath:
                path: /voyager/ceph/users/javierhn/results/vit
                type: Directory
          hostIPC: true
          containers:
            - image: vault.habana.ai/gaudi-docker/1.21.4/ubuntu22.04/habanalabs/pytorch-installer-2.6.0:latest
              name: vit-worker
              imagePullPolicy: Always
              resources:
                limits:
                  habana.ai/gaudi: 8
                  cpu: 95
                  memory: 409Gi
                  hugepages-2Mi: 30000Mi
                requests:
                  habana.ai/gaudi: 8
                  cpu: 95
                  memory: 409Gi
                  hugepages-2Mi: 30000Mi
              volumeMounts:
                - name: mydir
                  mountPath: /mydir
                - name: scratch
                  mountPath: /scratch
                - name: dataset
                  mountPath: /dataset
                - name: pretrained
                  mountPath: /pretrained
                - name: output
                  mountPath: /output
              command: ["/bin/bash", "-c"]
              args:
                - >-
                   /usr/bin/ssh-keygen -A;
                   /usr/sbin/sshd;
                   sleep 365d;
 
