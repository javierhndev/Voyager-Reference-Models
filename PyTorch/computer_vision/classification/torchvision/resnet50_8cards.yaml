apiVersion: v1
kind: Pod
metadata:
  name: resnet50-8cards
  namespace: yourusername-restricted
spec:
  restartPolicy: Never
  volumes:
    - name: scratch
      emptyDir: {}
    - name: dataset
      hostPath:
        path: /voyager/ceph/users/yourusername/datasets/imagenet/ILSVRC2012
        type: Directory
    - name: output
      hostPath:
        path: /voyager/ceph/users/yourusername/results/resnet/resnet50/1card
        type: Directory
  hostIPC: true
  containers:
    - name: gaudi-container
      image: vault.habana.ai/gaudi-docker/1.21.4/ubuntu22.04/habanalabs/pytorch-installer-2.6.0:latest
      volumeMounts:
        - mountPath: /scratch
          name: scratch
        - mountPath: /dataset
          name: dataset
        - mountPath: /output
          name: output
      resources:
        limits:
          memory: 256G
          cpu: 94
          habana.ai/gaudi: 8
          hugepages-2Mi: 30000Mi
        requests:
          memory: 256G
          cpu: 94
          habana.ai/gaudi: 8
          hugepages-2Mi: 30000Mi
      command: ["/bin/sh","-c"]
      args:
        - >-
           hl-smi;
           export HOME=/scratch/tmp;
           export PATH=/scratch/tmp/.local/bin:$PATH;
           export PYTHONPATH=/scratch/Model-References:$PYTHONPATH;
           mkdir -p /scratch/tmp/;
           cd /scratch;
           export N_CARDS=8;
           git clone -b 1.21.0 https://github.com/HabanaAI/Model-References;
           cd Model-References/PyTorch/computer_vision/classification/torchvision;
           pip install -r requirements.txt;
           export CMD="python3 train.py \
                         --batch-size 256 \
                         --model resnet50 \
                         --device hpu \
                         --print-freq 20 \
                         --dl-time-exclude False \
                         --workers 8 \
                         --dl-worker-type="HABANA" \
                         --data-path /dataset \
                         --output-dir /output \
                         --epochs 1 \
                         --autocast  \
                         --optimizer=lars -eoe 3 -ebe 4 \
                         --lars_base_learning_rate 2.5 \
                         --label-smoothing=0.1 \
                         --run-lazy-mode=False --use_torch_compile";

           mpirun -n ${N_CARDS} \
                    --allow-run-as-root \
                    --bind-to core \
                    --map-by ppr:4:socket:PE=6 \
                    -rank-by core --report-bindings \
                    --tag-output \
                    --merge-stderr-to-stdout \
                    -x PYTHONPATH \
                    $CMD;



