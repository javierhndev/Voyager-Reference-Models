apiVersion: v1
kind: Pod
metadata:
  name: yolox-8cards
  namespace: yourusername-restricted
spec:
  restartPolicy: Never
  volumes:
    - name: scratch
      emptyDir: {}
    - name: dataset
      hostPath:
        path: /voyager/ceph/users/yourusername/datasets/COCO
        type: Directory
    - name: output
      hostPath:
        path: /voyager/ceph/users/yourusername/results/yolox
        type: Directory
  hostIPC: true
  containers:
    - name: gaudi-container
      image: vault.habana.ai/gaudi-docker/1.21.4/ubuntu22.04/habanalabs/pytorch-installer-2.6.0:latest
      volumeMounts:
        - mountPath: /scratch
          name: scratch
        - mountPath: /dataset
          name: dataset
        - mountPath: /output
          name: output
      resources:
        limits:
          memory: 400G
          cpu: 94
          habana.ai/gaudi: 8
          hugepages-2Mi: 30000Mi
        requests:
          memory: 400G
          cpu: 94
          habana.ai/gaudi: 8
          hugepages-2Mi: 30000Mi
      command: ["/bin/sh","-c"]
      args:
        - >-
           hl-smi;
           export HOME=/scratch/tmp;
           export PATH=/scratch/tmp/.local/bin:$PATH;
           export PYTHONPATH=/scratch/Model-References/PyTorch/computer_vision/detection/yolox:$PYTHONPATH;
           export PT_HPU_LAZY_MODE=1;

           mkdir -p /scratch/tmp/;
           cd /scratch;
           git clone -b 1.21.0 https://github.com/HabanaAI/Model-References;
           cd Model-References/PyTorch/computer_vision/detection/yolox;
           pip install -r requirements.txt;
           pip install -v -e .;
           export CMD="python tools/train.py \
                   --name yolox-s --devices 8 --batch-size 16 --data_dir /dataset --hpu steps 500 output_dir /output";
           mpirun -n 8 \
               --bind-to core \
               --prefix $MPI_ROOT \
               --map-by ppr:4:socket:PE=6 \
               --rank-by core \
               --report-bindings \
               --allow-run-as-root \
               -x PYTHONPATH \
               -x PT_HPU_LAZY_MODE \
               $CMD;
         

