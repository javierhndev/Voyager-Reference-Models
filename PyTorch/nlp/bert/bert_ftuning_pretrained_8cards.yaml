apiVersion: v1
kind: Pod
metadata:
  name: bert-finetuning-8cards
  namespace: yourusername-restricted
spec:
  volumes:
    - name: scratch
      emptyDir: {}
    - name: dataset
      hostPath:
        path: /voyager/ceph/users/yourusername/datasets/bert/pytorch
        type: Directory
    - name: output
      hostPath:
        path: /voyager/ceph/users/yourusername/results/bert_pytorch/8cards
        type: Directory
    - name: dllog
      hostPath:
        path: /voyager/ceph/users/yourusername/tmp/log_directory
        type: Directory
  hostIPC: true
  containers:
    - name: gaudi-container
      image: vault.habana.ai/gaudi-docker/1.21.4/ubuntu22.04/habanalabs/pytorch-installer-2.6.0:latest
      volumeMounts:
        - mountPath: /scratch
          name: scratch
        - mountPath: /dataset
          name: dataset
        - mountPath: /output
          name: output
        - mountPath: /dllog
          name: dllog 
      resources:
        limits:
          memory: 256G
          cpu: 94
          habana.ai/gaudi: 8
          hugepages-2Mi: 30000Mi
        requests:
          memory: 256G
          cpu: 94
          habana.ai/gaudi: 8
          hugepages-2Mi: 30000Mi
      command: ["/bin/sh","-c"]
      args:
        - >- 
            hl-smi;
            export HOME=/scratch/tmp;
            export PATH=/scratch/tmp/.local/bin:$PATH;
            mkdir -p /scratch/tmp/;
            cd /scratch;
            export N_CARDS=8;
            git clone -b 1.21.0 https://github.com/HabanaAI/Model-References;
            export PYTHONPATH=/scratch/Model-References:$PYTHONPATH;
            cd Model-References/PyTorch/nlp/bert;
            pip install -r requirements.txt;
            export PT_HPU_LAZY_MODE=0;
            export CMD="python3 run_squad.py \
                            --do_train \
                            --bert_model=bert-large-uncased \
                            --config_file=./bert_config.json \
                            --use_torch_compile \
                            --use_habana \
                            --autocast \
                            --use_fused_adam \
                            --do_lower_case \
                            --output_dir=/output \
                            --json-summary=/dllog/dllogger.json \
                            --train_batch_size=24 \
                            --predict_batch_size=8 \
                            --seed=1 \
                            --max_seq_length=384 \
                            --doc_stride=128 \
                            --max_steps=-1  \
                            --learning_rate=3e-5 \
                            --num_train_epochs=2 \
                            --init_checkpoint=/dataset/pretrained-habana/1.13/ckpt_7038.pt \
                            --vocab_file=/dataset/uncased_L-24_H-1024_A-16/vocab.txt \
                            --train_file=/dataset/squad/v1.1/train-v1.1.json \
                            --skip_cache \
                            --do_predict  \
                            --predict_file=/dataset/squad/v1.1/dev-v1.1.json \
                            --do_eval \
                            --eval_script=/dataset/squad/v1.1/evaluate-v1.1.py \
                            --log_freq 20 ";
            
            
            mpirun -n ${N_CARDS} \
                    --allow-run-as-root \
                    --bind-to core \
                    --map-by ppr:4:socket:PE=6 \
                    -rank-by core --report-bindings \
                    --tag-output \
                    --merge-stderr-to-stdout \
                    -x PYTHONPATH \
                    $CMD;


